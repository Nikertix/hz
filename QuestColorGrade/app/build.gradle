plugins {
    id 'com.android.application'
}

android {
    namespace 'com.questcolor.grade'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.questcolor.grade'
        minSdk 29
        targetSdk 32          // как рекомендует Meta для Quest
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a'   // Quest = arm64
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    buildFeatures {
        prefab true               // нужен для OpenXR loader из AAR
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Подпись отладочным ключом - этого достаточно для установки на Quest через adb / SideQuest
            signingConfig signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.61'
}
