name: Собрать APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Android SDK, NDK и CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Установить Gradle 8.10.2
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Удалить локальные настройки SDK
        run: rm -f QuestColorGrade/local.properties

      - name: Подготовить отладочный ключ подписи
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Собрать APK
        working-directory: QuestColorGrade
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Подготовить APK
        run: |
          mkdir -p dist
          cp QuestColorGrade/app/build/outputs/apk/release/app-release.apk dist/QuestColorGrade.apk
          ls -lh dist

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestColorGrade-apk
          path: dist/QuestColorGrade.apk
          retention-days: 60
